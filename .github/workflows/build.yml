name: Build installer

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Unit tests
        run: dotnet test tests/Sai2Recovery.Tests/Sai2Recovery.Tests.csproj -c Release --logger "console;verbosity=normal" --logger GitHubActions

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Version
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") { $v = "${{ github.ref_name }}".TrimStart('v') }
          else { $v = "1.0.${{ github.run_number }}" }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Publish GUI
        run: >
          dotnet publish src/Sai2Recovery.App/Sai2Recovery.App.csproj -c Release -r win-x64
          --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:DebugType=none -p:Version=${{ steps.ver.outputs.version }}
          -o publish/app

      - name: Publish CLI
        run: >
          dotnet publish src/Sai2Recovery.Cli/Sai2Recovery.Cli.csproj -c Release -r win-x64
          --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=true
          -p:EnableCompressionInSingleFile=true -p:DebugType=none -p:Version=${{ steps.ver.outputs.version }}
          -o publish/cli

      - name: Smoke test CLI on fixtures
        shell: pwsh
        run: |
          ./publish/cli/sai2fix.exe analyze tests/Sai2Recovery.Tests/Fixtures/small_rgba.sai2
          if ($LASTEXITCODE -ne 0) { throw "sai2fix failed" }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DAppVersion=${{ steps.ver.outputs.version }}" "/DPublishDir=..\publish" installer\Sai2Recovery.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

      - name: Install, launch and uninstall (smoke test)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          trap { Write-Host "::error::Smoke test: $($_.Exception.Message) [at line $($_.InvocationInfo.ScriptLineNumber)]"; exit 1 }
          $setup = Get-ChildItem dist\SAI2Recovery-Setup-*.exe | Select-Object -First 1
          $p = Start-Process $setup.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CURRENTUSER','/TASKS="contextmenu"' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Setup exit code $($p.ExitCode)" }
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\SAI2 Recovery'
          $exe = Join-Path $dir 'SAI2Recovery.exe'
          if (-not (Test-Path $exe)) { throw "Not installed: $exe" }
          if (-not (Test-Path (Join-Path $dir 'sai2fix.exe'))) { throw 'sai2fix.exe missing' }
          $key = 'HKCU:\Software\Classes\SystemFileAssociations\.sai2\shell\SAI2Recovery\command'
          $cmd = (Get-ItemProperty $key).'(default)'
          Write-Host "::notice::Installed to $dir; context menu: $cmd"

          $fixture = Join-Path $PWD 'tests\Sai2Recovery.Tests\Fixtures\multi_tile_rgb.sai2'
          $app = Start-Process $exe -ArgumentList "`"$fixture`"" -PassThru
          Add-Type -AssemblyName UIAutomationClient, UIAutomationTypes
          # Windows PowerShell reads the script as ANSI, so keep it ASCII: "исправен" as code points
          $needle = -join [char[]](0x438,0x441,0x43F,0x440,0x430,0x432,0x435,0x43D)
          $texts = @()
          for ($i = 0; $i -lt 40; $i++) {
            Start-Sleep -Milliseconds 500
            if ($app.HasExited) { throw "GUI exited with code $($app.ExitCode)" }
            $app.Refresh()
            if ($app.MainWindowHandle -eq 0) { continue }
            $root = [System.Windows.Automation.AutomationElement]::FromHandle($app.MainWindowHandle)
            $all = $root.FindAll([System.Windows.Automation.TreeScope]::Descendants, [System.Windows.Automation.Condition]::TrueCondition)
            $texts = @($all | ForEach-Object { $_.Current.Name } | Where-Object { $_ })
            if ($texts -match $needle) { break }
          }
          Write-Host "Window: $($app.MainWindowTitle)"
          Write-Host ("UI texts: " + (($texts | Select-Object -Unique | Select-Object -First 40) -join ' | '))
          if (-not ($texts -match $needle)) { throw ("GUI did not show the analysis result. Window='" + $app.MainWindowTitle + "' texts=" + (($texts | Select-Object -Unique | Select-Object -First 30) -join ' | ')) }
          Write-Host "::notice::GUI OK - $($app.MainWindowTitle); status: $(($texts -match $needle) | Select-Object -First 1)"
          $app.Kill()
          Start-Sleep 1
          $u = Start-Process (Join-Path $dir 'unins000.exe') -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES' -Wait -PassThru
          Start-Sleep 3
          if (Test-Path $exe) { throw 'Uninstall left the program behind' }

      - name: Portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path publish/app/SAI2Recovery.exe, publish/cli/sai2fix.exe, README.md -DestinationPath "dist/SAI2Recovery-portable-${{ steps.ver.outputs.version }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: SAI2Recovery-${{ steps.ver.outputs.version }}
          path: dist/*

      # Every build of the default branch (or a v* tag) is published as a release,
      # so the installer is always downloadable from the Releases page.
      - name: Release
        if: github.ref_type == 'tag' || (github.event_name == 'push' && github.ref_name == github.event.repository.default_branch)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', steps.ver.outputs.version) }}
          target_commitish: ${{ github.sha }}
          name: SAI2 Recovery ${{ steps.ver.outputs.version }}
          make_latest: true
          body: |
            Установщик для Windows 10/11 (64 бит): **SAI2Recovery-Setup-${{ steps.ver.outputs.version }}.exe**.
            Без установки: SAI2Recovery-portable-${{ steps.ver.outputs.version }}.zip.
            Описание и алгоритм — в README репозитория.
          files: dist/*
