name: Build Android APK

on:
  push:
    branches:
      - main
      - claude/upbeat-davinci-a3sujc
    paths:
      - 'arena-shards/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: arena-shards
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Don't depend on the runner image's exact SDK layout (it's changed under us twice
      # already: android-actions/setup-android installs a removed legacy package, and the
      # image's own cmdline-tools weren't where docs said). Fetch a known-good cmdline-tools
      # build straight from Google ourselves — GitHub-hosted runners have unrestricted
      # internet, unlike this agent's own sandbox — and install only what's needed from it.
      - name: Install Android cmdline-tools and required SDK packages
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-$HOME/android-sdk}"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -sSL -o /tmp/cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: arena-shards/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run core tests
        run: pnpm --filter @arena-shards/core test

      - name: Build web client and sync Capacitor
        working-directory: arena-shards/apps/client
        run: |
          pnpm exec vite build
          pnpm exec cap sync android

      - name: Build debug APK
        working-directory: arena-shards/apps/client/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: arena-shards-debug-apk
          path: arena-shards/apps/client/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish APK to a rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Arena of Shards — последняя сборка Android (debug)
          body: |
            Автоматическая debug-сборка APK из ветки `${{ github.ref_name }}` (коммит ${{ github.sha }}).
            Собрано workflow'ом `.github/workflows/android-apk.yml`. Не подписана релизным ключом —
            только для установки через "неизвестные источники" на своём устройстве.
          files: arena-shards/apps/client/android/app/build/outputs/apk/debug/app-debug.apk
          prerelease: true
